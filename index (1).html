
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pour MIMI ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-family:Arial,sans-serif;
  color:white;
  background:linear-gradient(135deg,#100611,#50102f,#19091e);
}

.hearts{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}

.heart{
  position:absolute;
  bottom:-50px;
  animation:floatUp linear forwards;
  opacity:.8;
}

@keyframes floatUp{
  from{transform:translateY(0) rotate(0);opacity:0}
  15%{opacity:.8}
  to{transform:translateY(-115vh) rotate(360deg);opacity:0}
}

.card{
  position:relative;
  z-index:2;
  width:90%;
  max-width:600px;
  padding:40px 25px;
  text-align:center;
  border:1px solid #ffffff35;
  border-radius:25px;
  background:#ffffff10;
  backdrop-filter:blur(15px);
  box-shadow:0 0 50px #ff267533;
}

.big-heart{
  font-size:65px;
  animation:beat 1.2s infinite;
  margin-bottom:15px;
}

@keyframes beat{
  50%{transform:scale(1.15)}
}

h1{
  color:#ff8fba;
  font-size:clamp(35px,8vw,55px);
  margin-bottom:15px;
  text-shadow:0 0 20px #ff3986;
}

.subtitle{
  color:#ffd7e6;
  margin-bottom:25px;
}

#message{
  min-height:170px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:20px;
  line-height:1.9;
  color:#fff0f6;
  overflow-wrap:anywhere;
  margin-bottom:20px;
}

.cursor{
  color:#ff8fba;
  animation:blink .7s infinite;
}

@keyframes blink{
  50%{opacity:0}
}

button{
  border:0;
  border-radius:40px;
  padding:14px 20px;
  margin:7px 3px;
  cursor:pointer;
  font-size:14px;
  font-weight:bold;
  transition:.25s;
}

button:hover{transform:scale(1.04)}

#musicBtn{
  background:linear-gradient(45deg,#ff347f,#ff78a9);
  color:white;
}

#moreBtn{
  color:#ffd7e6;
  background:#ffffff12;
  border:1px solid #ff8fba;
}

.footer{
  margin-top:25px;
  font-size:13px;
  color:#dba9bd;
}

@media(max-width:480px){
  .card{padding:30px 18px}
  #message{font-size:18px;min-height:190px}
  button{width:100%;margin:7px 0}
}
</style>
</head>

<body>

<div class="hearts" id="hearts"></div>

<main class="card">
  <div class="big-heart">❤️</div>
  <h1>Pour MIMI</h1>
  <p class="subtitle">J'ai quelque chose à te dire...</p>

  <div id="message">
    <span id="typed"></span><span class="cursor">|</span>
  </div>

  <button id="musicBtn">▶ Écouter notre chanson</button>
  <button id="moreBtn">💌 Lire la suite</button>

  <audio id="song" src="song.mp3" loop preload="auto"></audio>

  <p class="footer">Créé avec amour ❤️ spécialement pour toi, MIMI.</p>
</main>

<script>
const messages = [
  "MIMI ❤️, kayn wahed l7aja f 9elbi bghit ngoulha lik...",
  "Mlli kanhder m3ak, kan7ess b far7a zwina li ma kan9derch nwsefha. 💗",
  "Bdit kan7ess b chi macha3ir zwina tijahk w bghit nkoun sarih m3ak.",
  "Ma bghitch n drat 3lik ou la nfrad elik  chi jawab. Bghit ghir nkoun sarih m3ak. ❤️",
  "Nti insanа 3ziza 3liya, w hadchi li kan9oul lik jay mn 9elbi. 💖",
  "Whatever your answer is, I'll respect your feelings. Lmohim 3ndi hiya tkouni mrtaha ❤️"
];

const typed = document.getElementById("typed");
const moreBtn = document.getElementById("moreBtn");

let messageIndex = 0;
let charIndex = 0;
let timer = null;
let generation = 0;

function showMessage(index) {
  // إلغاء أي كتابة قديمة باش ما يتخلطوش الرسائل
  clearTimeout(timer);
  generation++;

  const thisGeneration = generation;
  messageIndex = index % messages.length;
  charIndex = 0;
  typed.textContent = "";

  function writeLetter() {
    if (thisGeneration !== generation) return;

    const current = messages[messageIndex];

    if (charIndex < current.length) {
      typed.textContent += current.charAt(charIndex);
      charIndex++;
      timer = setTimeout(writeLetter, 45);
    } else {
      // ملي تسالي الرسالة، تسنى ثم انتقل للي من بعدها
      timer = setTimeout(() => {
        if (thisGeneration === generation) {
          showMessage((messageIndex + 1) % messages.length);
        }
      }, 2500);
    }
  }

  writeLetter();
}

// البداية الأوتوماتيكية
showMessage(0);

// زر الرسالة التالية
moreBtn.addEventListener("click", () => {
  showMessage((messageIndex + 1) % messages.length);
});

// الموسيقى
const song = document.getElementById("song");
const musicBtn = document.getElementById("musicBtn");

musicBtn.addEventListener("click", async () => {
  if (song.paused) {
    try {
      await song.play();
      musicBtn.textContent = "⏸ Pause la musique";
    } catch (error) {
      musicBtn.textContent = "❌ Vérifie le fichier song.mp3";
    }
  } else {
    song.pause();
    musicBtn.textContent = "▶ Écouter notre chanson";
  }
});

// القلوب المتحركة
const hearts = document.getElementById("hearts");

function createHeart() {
  const heart = document.createElement("span");
  heart.className = "heart";
  heart.textContent = ["❤️","💕","💗","💖","💘"][
    Math.floor(Math.random() * 5)
  ];

  heart.style.left = Math.random() * 100 + "%";
  heart.style.fontSize = (15 + Math.random() * 22) + "px";
  heart.style.animationDuration = (6 + Math.random() * 7) + "s";

  hearts.appendChild(heart);
  setTimeout(() => heart.remove(), 14000);
}

setInterval(createHeart, 500);
</script>

</body>
</html>
